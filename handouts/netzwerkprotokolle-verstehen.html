<script type="text/markdown" id="md"># Handout: Netzwerkprotokolle verstehen


## In einem Satz

Protokolle sind feste Regeln, damit Geräte im Netzwerk fehlerfrei miteinander sprechen können – jede Schicht hat ihre Aufgabe.

## Worum geht's

In einem Netzwerk müssen sich alle Geräte auf gemeinsame Sprachen einigen. Diese Sprachen heißen Protokolle. Sie regeln Aufbau, Adressierung, Fehlerprüfung und Ablauf der Datenübertragung. Das TCP/IP-Modell ordnet diese Protokolle in vier Schichten: Netzzugang (z. B. Ethernet), Internet (IP), Transport (TCP/UDP) und Anwendung (HTTP, DNS, DHCP). Jede Schicht nutzt die Dienste der darunterliegenden und fügt eigene Steuerinformationen hinzu (Kapselung).

> [!example] Alltagsvergleich
> Stell dir einen Briefversand vor: Die Anwendung schreibt den Brief (Daten). TCP/UDP steckt ihn in einen Umschlag mit Absender- und Empfänger-Port (Transport). IP schreibt die Postadresse drauf (Internet). Ethernet liefert ihn zum nächsten Postverteiler per LKW (Netzzugang). DHCP ist der Einwohnermeldeamt, das dir beim Einzug automatisch eine freie Adresse gibt. DNS ist das Telefonbuch, das Namen in Nummern übersetzt.

## Kernpunkte

1. **Protokoll**: Einheitliches Regelwerk für Format, Bedeutung und Ablauf der Kommunikation zwischen Geräten.
2. **TCP/IP-Modell (4 Schichten)**: 1. Netzzugang (Ethernet, WLAN) – physikalische Übertragung im LAN. 2. Internet (IP) – Adressierung & Routing paketweise, verbindungslos. 3. Transport (TCP, UDP) – Ende-zu-Ende-Verbindung zu Anwendungen über **Ports**. 4. Anwendung (HTTP, DNS, DHCP, SMTP) – Nutzdaten der Programme.
3. **Kapselung**: Daten wandern von Schicht 4 nach 1. Jede Schicht fügt einen **Header** (Kopf) hinzu. Ethernet nennt das Ergebnis **Frame**, IP **Paket**, TCP **Segment**, UDP **Datagramm**.
4. **Ethernet (Schicht 2)**: Regelt **MAC-Adresse** (48 Bit, Hardware-Adresse), Frame-Aufbau (Ziel-MAC, Quell-MAC, Typ-Feld z. B. 0x0800 für IPv4, Prüfsumme FCS). MTU = 1500 Byte Nutzdaten.
5. **IP (Schicht 3)**: Vergeben logische **IP-Adressen** (IPv4: 32 Bit, IPv6: 128 Bit). Routet Pakete netzwerkübergreifend. Unzuverlässig (keine Quittung).
6. **TCP (Schicht 4)**: Verbindungsorientiert (3-Wege-Handshake), zuverlässig (Quittung, Wiederholung, Reihenfolge), Fluss- & Staukontrolle. Hoher Overhead. Typisch: Web (Port 80/443), Mail, SSH.
7. **UDP (Schicht 4)**: Verbindungslos, unzuverlässig, kein Overhead, schnell. Unterstützt Multicast. Typisch: DNS (Port 53), DHCP (Port 67/68), VoIP, Streaming, Gaming.
8. **DHCP vs. DNS**: **DHCP** (Dynamic Host Configuration Protocol) vergibt **automatisch IP-Adresse, Subnetzmaske, Gateway, DNS-Server** an Clients (UDP Port 67/68). **DNS** (Domain Name System) löst **Namen (www.example.com) in IP-Adressen auf** (UDP/TCP Port 53).
9. **Socket**: Kombination aus **IP-Adresse + Portnummer** (z. B. 192.168.1.5:443). Identifiziert eindeutig einen Kommunikationsendpunkt (Prozess) auf einem Host.

## Vergleich TCP vs. UDP (Transportschicht)

| Merkmal | TCP | UDP |
|---|---|---|
| Verbindung | Verbindungsorientiert (Handshake) | Verbindungslos |
| Zuverlässigkeit | Sicher (ACK, Wiederholung, Sortierung) | Unsicher (Best Effort) |
| Overhead | Groß (Header ca. 20–60 Byte) | Klein (Header 8 Byte) |
| Fluss-/Staukontrolle | Ja | Nein |
| Typische Ports | 80 (HTTP), 443 (HTTPS), 22 (SSH), 25 (SMTP) | 53 (DNS), 67/68 (DHCP), 123 (NTP) |
| Einsatz | Dateiübertragung, Web, Mail | Streaming, DNS, DHCP, Echtzeit |

## Beispiel: Ablauf: Client bekommt IP per DHCP (DORA-Prozess)

1. 1. Discover: Client sendet Broadcast (UDP Port 67) – 'Ich brauche eine IP!'
2. 2. Offer: DHCP-Server antwortet (UDP Port 68) – 'Hier ist ein Angebot (IP, Maske, Gateway, Lease-Zeit).'
3. 3. Request: Client fordert offiziell an (Broadcast) – 'Ich nehme das Angebot.'
4. 4. Acknowledge: Server bestätigt (Unicast) – 'IP ist dir zugewiesen.' Client konfiguriert Interface.

**Ergebnis:** Client hat nun vollständige Netzwerkkonfiguration ohne manuelles Eingreifen. Lease-Zeit läuft, danach Verlängerung nötig.

## 💡 Merksätze

> 💡 DHCP gibt Adressen, DNS löst Namen auf.

> 💡 TCP = Einschreiben mit Rückschein, UDP = Postkarte.

> 💡 IP routet Pakete, TCP sichert die Daten.

> 💡 MAC = Haustürschild (lokal), IP = Postadresse (global).

> 💡 Socket = IP + Port = Tür zum Programm.

## Prüfungsfallen

- Verwechslung: DHCP vs. DNS. Richtig: DHCP konfiguriert das Gerät (IP-Adresse), DNS übersetzt Namen in IPs.
- Verwechslung: TCP vs. IP. Richtig: IP ist verbindungslos und unzuverlässig (Routing). TCP baut darauf auf und sichert die Übertragung (Transport).
- Verwechslung: MAC-Adresse vs. IP-Adresse. Richtig: MAC (Layer 2) für lokale Zustellung im LAN, IP (Layer 3) für netzwerkübergreifendes Routing.
- Verwechslung: Port vs. Socket. Richtig: Port ist die Nummer (16 Bit), Socket ist die Kombination IP:Port (Endpunkt).
- Verwechslung: Frame vs. Paket vs. Segment. Richtig: Ethernet=Frame (L2), IP=Paket (L3), TCP=Segment (L4), UDP=Datagramm (L4).

## Im Buch

- TCP/IP-Modell: S. 322
- Ethernet-Frame: S. 306
- TCP: S. 308

## Prüffragen

> [!question]- Welcher Dienst vergibt IP-Adressen automatisch an Clients?
> DHCP (Dynamic Host Configuration Protocol). Es verteilt IP-Adresse, Subnetzmaske, Standardgateway und DNS-Server per UDP (Port 67/68).

> [!question]- Was ist der Unterschied zwischen TCP und UDP bei der Zustellung?
> TCP prüft die Zustellung, quittiert empfangene Segmente, fordert fehlende an und sortiert sie (verlässlich). UDP sendet einfach, ohne Prüfung, Quittung oder Nachsendung (Best Effort).

> [!question]- Wofür steht das Typ-Feld im Ethernet-Frame (z. B. 0x0800)?
> Es kennzeichnet das Protokoll der nächsthöheren Schicht (Layer 3). 0x0800 = IPv4, 0x86DD = IPv6, 0x8100 = VLAN-Tag (gefolgt von Typ).

> [!question]- Was ist ein Socket und woraus besteht er?
> Ein Socket ist der eindeutige Endpunkt einer Kommunikation. Er besteht aus der IP-Adresse des Hosts und der Portnummer des Prozesses (z. B. 192.168.1.10:443).

> [!question]- Warum nutzt DHCP UDP und nicht TCP?
> DHCP läuft oft vor dem Aufbau einer TCP-Verbindung (Client hat noch keine IP). UDP ist verbindungslos, schnell und funktioniert per Broadcast auch ohne etablierte Verbindung.

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
