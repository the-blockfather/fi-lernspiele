<script type="text/markdown" id="md"># Handout: Socket und Ports verstehen


## In einem Satz

Ein Socket ist die Kombination aus IP-Adresse und Portnummer und identifiziert eine Anwendung auf einem Rechner weltweit eindeutig (Buch S. 308; bei privaten IP-Adressen gilt das nur im jeweiligen Netz); eine Verbindung benötigt immer zwei Sockets (Quelle und Ziel).

## Worum geht's

Die IP-Adresse findet den richtigen Rechner im Netz. Die Portnummer findet das richtige Programm auf diesem Rechner. Erst zusammen ergeben sie einen Socket. Damit zwei Geräte sprechen können, braucht man den Socket des Absenders (Quell-IP + Quell-Port) und den Socket des Empfängers (Ziel-IP + Ziel-Port). Der Quell-Port wird meist zufällig vom System vergeben. Der Ziel-Port ist fest für den Dienst (z. B. 80 für Web). So kann ein Server viele Anfragen gleichzeitig auseinanderhalten.

> [!example] Alltagsvergleich
> Stell dir ein Hochhaus vor. Die IP-Adresse ist die Straßenadresse des Hauses. Die Portnummer ist der Name am Briefkasten (z. B. 'Familie Müller' oder 'Bäckerei'). Der Socket ist die vollständige Anschrift: 'Hauptstraße 5, Familie Müller'. Ein Brief braucht immer eine Absender-Anschrift und eine Empfänger-Anschrift – also zwei Sockets.

## Kernpunkte

1. Ein **Socket** = **IP-Adresse** + **Portnummer** (TCP oder UDP).
2. Die **IP-Adresse** (Schicht 3) adressiert den Rechner, der **Port** (Schicht 4) die Anwendung darauf.
3. Eine Verbindung besteht aus **zwei Sockets**: Quell-Socket (Client) und Ziel-Socket (Server).
4. Schreibweise IPv4: `IP:Port` (z. B. `192.168.1.20:51734`).
5. Schreibweise IPv6: `[IP]:Port` (z. B. `[2001:db8::1]:80`), weil IPv6 schon Doppelpunkte nutzt.
6. **Well-known Ports** (0–1023) sind festen Diensten zugeordnet (HTTP=80, HTTPS=443).
7. **Dynamische Ports** (49152–65535, IANA/RFC 6335, Buch S. 338) vergibt das Betriebssystem kurzfristig als Quell-Ports; je nach Betriebssystem liegt der genutzte Bereich anders (Linux standardmäßig 32768–60999).
8. **Socket ≠ Port**: Der Port allein sagt nicht, *wo* der Rechner steht. **Socket ≠ MAC**: MAC ist nur lokal (Schicht 2), Socket geht weltweit (Schicht 3+4).

## Beispiel: HTTPS-Aufruf (Client ↔ Server)

| Seite | IP-Adresse | Port | Socket |
|---|---|---|---|
| Client (Quelle) | 192.168.1.20 | 51734 (dynamisch) | 192.168.1.20:51734 |
| Webserver (Ziel) | 203.0.113.10 | 443 (HTTPS) | 203.0.113.10:443 |

## 💡 Merksätze

> 💡 IP sucht den Rechner, Port sucht das Programm.

> 💡 Ein Socket = IP plus Port, ohne geht es nicht fort.

> 💡 Verbindung braucht zwei Endpunkte: Quelle und Ziel, das ist das Spiel.

> 💡 IPv6 in Klammern setzen, dann kann der Port nicht verletzen.

## Prüfungsfallen

- Verwechslung: Socket = Port. Richtig: Socket = IP + Port.
- Verwechslung: Eine Verbindung hat einen Socket. Richtig: Sie hat zwei (Quelle + Ziel).
- Verwechslung: Quell-Port ist fest wie Ziel-Port. Richtig: Quell-Port ist meist dynamisch (hohe Nummer).
- Verwechslung: IPv6-Schreibweise wie IPv4. Richtig: IPv6-Adresse in eckige Klammern setzen `[IP]:Port`.

## Prüffragen

> [!question]- Was ist ein Socket und aus welchen zwei Teilen besteht er?
> Ein Socket ist die eindeutige Adresse einer Netzwerkanwendung. Er besteht aus der IP-Adresse des Rechners und der Portnummer des Programms (TCP oder UDP).

> [!question]- Wie viele Sockets sind an einer TCP-Verbindung beteiligt und welche sind das?
> Zwei Sockets: der Quell-Socket (Client-IP + Client-Port) und der Ziel-Socket (Server-IP + Server-Port).

> [!question]- Warum werden bei IPv6-Adressen mit Port eckige Klammern verwendet?
> Weil IPv6-Adressen selbst Doppelpunkte als Trennzeichen enthalten. Die Klammern zeigen klar an, wo die Adresse endet und die Portnummer beginnt.

> [!question]- Ein Client öffnet zwei Browser-Tabs zur gleichen Webseite (gleiche Server-IP, gleicher Port 443). Wie unterscheidet der Server die beiden Verbindungen?
> Der Client nutzt für jeden Tab einen anderen dynamischen Quell-Port. Die beiden Quell-Sockets (Client-IP:Port1 und Client-IP:Port2) sind unterschiedlich, obwohl der Ziel-Socket gleich ist.

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
