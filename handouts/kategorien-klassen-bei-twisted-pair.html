<script type="text/markdown" id="md"># Handout: Kategorien & Klassen bei Twisted Pair


## In einem Satz

Die Kategorie beschreibt das einzelne Bauteil (Kabel, Dose, Patchkabel), die Klasse die gemessene Leistung der ganzen Strecke – das schwächste Bauteil begrenzt alles.

## Worum geht's

Bei Twisted-Pair-Kupferkabeln steht die Kategorie (z. B. Cat 6) auf der Verpackung und nennt die maximal mögliche Bandbreite in MHz. Die Klasse (z. B. Klasse E) wird erst nach dem Verlegen gemessen: Permanent Link (fest verlegte Strecke) und Channel Link (gesamt bis zum Endgerät). Werden Bauteile verschiedener Kategorien gemischt, gilt immer die niedrigste Kategorie für die ganze Strecke. Höhere Bandbreite in MHz ermöglicht höhere Datenraten (z. B. 10 Gbit/s).

> [!example] Alltagsvergleich
> Stell dir eine Wasserleitung vor: Die Kategorie ist der aufgedruckte Innendurchmesser der einzelnen Rohrstücke (Bauteile). Die Klasse ist der tatsächliche Wasserdruck, der am Wasserhahn ankommt, nachdem alles verschraubt wurde. Ein einziges zu schmales Stück (niedrigste Kategorie) drosselt den gesamten Durchfluss (Klasse).

## Kernpunkte

1. **Kategorie** = Bauteil-Eigenschaft (Stecker, Kabel, Dose, Patchfeld). Steht auf der Hülle. Einheit: **MHz** (Bandbreite).
2. **Klasse** = Strecken-Eigenschaft (gemessene Leistung). Wird nach Installation mit Messgerät geprüft. Bezeichnung: Klasse D, E, EA, F, FA, G.
3. **Zusammenhang**: Je höher die Frequenz (MHz), desto mehr Daten pro Sekunde möglich. Cat 5e (100 MHz) → 1 Gbit/s. Cat 6A (500 MHz) → 10 Gbit/s über 100 m.
4. **Schwächstes Glied**: Patchfeld Cat 7 + Kabel Cat 6 + Dose Cat 5e = Strecke leistet nur Cat 5e (Klasse D, 100 MHz).
5. **Messung Pflicht**: Nur das Messprotokoll nach dem Verlegen beweist die erreichte Klasse. Gute Bauteile allein reichen nicht (schlechte Verarbeitung = schlechte Klasse).
6. **Wichtige Werte (Prüfungswissen)**: Cat 5/5e = 100 MHz, **Cat 6 = 250 MHz**, Cat 6A = 500 MHz, Cat 7 = 600 MHz, Cat 8 = 2000 MHz.

## Kategorien, Bandbreiten und Klassen (Buch-Tabelle)

| Kategorie | Bandbreite | Klasse | Typischer Einsatz |
|---|---|---|---|
| Cat 5 | 100 MHz | D | 100 Mbit/s |
| Cat 5e | 100 MHz | D | 1 Gbit/s |
| Cat 6 | 250 MHz | E | 10 Gbit/s (kurz) |
| Cat 6A | 500 MHz | EA | 10 Gbit/s (100 m) |
| Cat 7 | 600 MHz | F | Multimedia |
| Cat 7A | 1000 MHz | FA | Multimedia |
| Cat 8 | 2000 MHz | G | 25G/40GBase-T |

## Beispiel: Welche Kategorie für 10 Gbit/s über 100 m?

1. 1. Ziel: 10GBase-T über volle 100 m Channel Link.
2. 2. Buch-Tabelle prüfen: Cat 6 (250 MHz, Klasse E) reicht nur für kurze Strecken (~55 m).
3. 3. Cat 6A (500 MHz, Klasse EA) ist für 100 m spezifiziert.
4. 4. Alle Bauteile (Kabel, Dosen, Patchkabel, Patchfeld) müssen mind. Cat 6A sein.
5. 5. Nach Verlegung: Permanent Link (≤ 90 m) und Channel Link (≤ 100 m) messen lassen.

**Ergebnis:** Mindestens Cat 6A (Klasse EA) an allen Stellen. Cat 6 reicht nicht für 100 m.

## 💡 Merksätze

> 💡 Kategorie = Verpackung, Klasse = Messprotokoll.

> 💡 Cat 6 = 250 MHz, Cat 6A = 500 MHz, Cat 7 = 600 MHz, Cat 8 = 2000 MHz.

> 💡 Das schwächste Bauteil bestimmt die Klasse der ganzen Strecke.

> 💡 Ohne Messung nach dem Verlegen gibt es keine Klasse, nur Kategorie.

> 💡 Permanent Link max 90 m, Channel Link max 100 m – 10 m Puffer für Patchkabel.

## Prüfungsfallen

- Verwechslung: Kategorie und Klasse sind dasselbe. / Richtig: Kategorie = Bauteil, Klasse = gemessene Strecke.
- Verwechslung: Cat 6 schafft 10 Gbit/s über 100 m. / Richtig: Cat 6 nur ~55 m, für 100 m braucht man Cat 6A.
- Verwechslung: Bandbreite Cat 5e = 250 MHz. / Richtig: Cat 5/5e = 100 MHz, Cat 6 = 250 MHz.
- Verwechslung: Patchkabel-Kategorie egal, Stecker passt ja. / Richtig: Patchkabel muss gleiche/höhere Kategorie haben, sonst Flaschenhals.
- Verwechslung: Klasse wird vom Hersteller garantiert. / Richtig: Klasse wird erst vor Ort nach Installation gemessen.

## Im Buch

- Permanent Link: S. 313
- Channel Link: S. 313

*Seiten aus dem Stichwortverzeichnis (automatisch zugeordnet).*

## Prüffragen

> [!question]- Welche Bandbreite in MHz hat Kategorie 6 laut Buchtabelle?
> Cat 6 hat 250 MHz Bandbreite (Klasse E). Cat 5/5e haben 100 MHz, Cat 6A 500 MHz.

> [!question]- Ein Patchfeld ist Cat 7, das Verlegekabel Cat 6A, die Netzwerkdose Cat 5e. Welche Klasse erreicht die Strecke maximal?
> Maximal Klasse D (100 MHz), weil die Dose Cat 5e das schwächste Glied ist. Die Klasse richtet sich immer nach dem schlechtesten Bauteil.

> [!question]- Was ist der Unterschied zwischen Permanent Link und Channel Link?
> Permanent Link = feste Strecke Patchfeld → Dose (max. 90 m). Channel Link = Gesamtstrecke Switch → Endgerät inkl. Patchkabel im Schrank und Anschlusskabel am Platz (max. 100 m).

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
