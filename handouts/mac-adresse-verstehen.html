<script type="text/markdown" id="md"># Handout: MAC-Adresse verstehen


## In einem Satz

Die MAC-Adresse ist die feste Hardware-Adresse eines Netzwerk-Interfaces, mit der Switches Geräte im lokalen Netz eindeutig identifizieren und Frames gezielt zustellen.

## Worum geht's

Jede Netzwerk-Schnittstelle (LAN-Port, WLAN-Chip) hat eine weltweit einmalige MAC-Adresse. Sie wird vom Hersteller fest in die Hardware geschrieben und besteht aus 48 Bit (6 Byte). Die ersten 3 Byte kennzeichnen den Hersteller (OUI), die letzten 3 Byte sind die Geräte-Nummer. Ein Switch lernt, welche MAC-Adresse an welchem Port hängt, und schickt Daten nur dorthin – ein Hub dagegen sendet immer an alle Ports. Die MAC-Adresse arbeitet auf OSI-Schicht 2 (Sicherungsschicht), die IP-Adresse auf Schicht 3 (Vermittlungsschicht). ARP löst die IP-Adresse in die passende MAC-Adresse auf, damit Ethernet-Frames gebaut werden können.

> [!example] Alltagsvergleich
> Die MAC-Adresse ist wie die Fahrgestellnummer eines Autos: fest vom Hersteller vergeben, weltweit einzigartig, am Fahrzeug selbst angebracht. Die IP-Adresse ist wie das Kennzeichen: wird vom Zulassungsamt (Netzwerk) vergeben, kann wechseln, und sagt, wo das Auto gerade unterwegs ist. Der Switch ist der Parkplatzwärter, der über die Fahrgestellnummer weiß, auf welchem Parkplatz (Port) welches Auto steht.

## Kernpunkte

1. Die **MAC-Adresse** (Media Access Control) ist eine **48-Bit-Hardware-Adresse** (6 Byte, z. B. 24:65:11:AB:CD:EF), werkseitig in das Netzwerk-Interface eingebrannt (Buch S. 331: Bit 0 des ersten Oktetts = Unicast/Multicast, Bit 1 = global eindeutig/lokal vergeben; die Broadcast-MAC lautet ff-ff-ff-ff-ff-ff; per Software kann die MAC auch lokal geändert werden).
2. Die **ersten 3 Byte (OUI)** identifizieren den **Hersteller** (z. B. AVM, Intel), die **letzten 3 Byte** das konkrete **Gerät**.
3. Ein **Switch** baut eine **Forwarding-Tabelle** (MAC-Adresse ↔ Port) auf und leitet Frames bei bekannter Ziel-MAC **gezielt nur an den richtigen Port** weiter (Broadcast und unbekannte Ziele gehen an alle Ports) – ein **Hub** kennt keine Adressen und flutet alle Ports.
4. **MAC-Adresse ≠ IP-Adresse**: MAC = Schicht 2, hardwarefest, lokal im LAN. IP = Schicht 3, logisch, vom Netzwerk vergeben, auch über Router hinweg gültig.
5. Zum Bauen eines **Ethernet-Frames** braucht der Sender die **Ziel-MAC**. Liegt sie nicht vor, fragt **ARP** per Broadcast: „Wer hat IP X?“. Die Antwort liefert die MAC.
6. Im **Ethernet-Frame** stehen **Ziel-MAC (6 Byte)** und **Quell-MAC (6 Byte)** ganz vorne im Header – direkt nach Präambel und SFD.
7. Ein Gerät mit **zwei Interfaces** (z. B. LAN + WLAN) hat **zwei verschiedene MAC-Adressen** – eine pro Interface.

## MAC-Adresse vs. IP-Adresse

| Merkmal | MAC-Adresse | IP-Adresse |
|---|---|---|
| OSI-Schicht | Schicht 2 (Sicherung) | Schicht 3 (Vermittlung) |
| Vergabe | Hersteller (fest) | Netzwerk / DHCP (änderbar) |
| Gültigkeit | Nur im lokalen LAN | Öffentliche IPs weltweit, private nur lokal |
| Format | 48 Bit (6 Byte, Hex) | IPv4: 32 Bit, IPv6: 128 Bit |
| Auflösung | ARP (IP → MAC) | DNS (Name → IP) |

## Beispiel: MAC-Adresse im Ethernet-Frame erkennen

1. Ein Frame wird erfasst: Ziel-MAC = 00:1A:2B:3C:4D:5E, Quell-MAC = 00:1B:44:11:3A:B7, Typ = 0x0800 (IPv4).
2. Die ersten 6 Byte nach Präambel+SFD sind die Ziel-MAC: 00:1A:2B:3C:4D:5E.
3. Die nächsten 6 Byte sind die Quell-MAC: 00:1B:44:11:3A:B7.
4. Das Typ-Feld (2 Byte) 0x0800 zeigt: Nutzdaten enthalten ein IPv4-Paket.
5. Der Switch liest die Ziel-MAC, schaut in seiner Tabelle nach dem Port und leitet nur dorthin weiter.

**Ergebnis:** Ziel-MAC und Quell-MAC sind die ersten 12 Byte des Ethernet-Headers (nach 8 Byte Präambel+SFD).

## 💡 Merksätze

> 💡 MAC = Hardware-Ausweis, IP = Wohnadresse.

> 💡 Switch merkt sich: MAC → Port. Hub schreit in alle Richtungen.

> 💡 OUI = Hersteller-Kennung (erste 3 Byte).

> 💡 ARP fragt: Wer hat diese IP? Antwort: Meine MAC ist ...

> 💡 Ein Interface – eine MAC. Zwei Interfaces – zwei MACs.

## Prüfungsfallen

- Verwechslung: MAC-Adresse ist die IP-Adresse des Geräts. Richtig: MAC ist Hardware-Adresse (Schicht 2), IP ist logische Adresse (Schicht 3).
- Verwechslung: Ein Gerät hat nur eine MAC-Adresse. Richtig: Jedes Netzwerk-Interface hat seine eigene MAC-Adresse.
- Verwechslung: ARP löst Namen in IPs auf. Richtig: ARP löst IP in MAC auf. DNS löst Namen in IPs auf.
- Verwechslung: Switch und Hub arbeiten gleich. Richtig: Switch nutzt MAC-Tabelle für gezielte Weiterleitung, Hub flutet alle Ports.
- Verwechslung: Ziel-MAC im Frame ist immer die MAC des Endgeräts. Richtig: Bei Zielen im anderen Netz ist Ziel-MAC die MAC des Routers (Default Gateway).

## Im Buch

- Switch: S. 340, S. 371
- Hub: S. 340
- ARP: S. 326
- Ethernet-Frame: S. 306
- MAC-Adressen (Aufbau, OUI, Unicast/Multicast-Bit): S. 331


## Prüffragen

> [!question]- Was ist der Unterschied zwischen MAC-Adresse und IP-Adresse?
> MAC-Adresse ist hardwarefest (Hersteller), 48 Bit, Schicht 2, nur lokal im LAN gültig. IP-Adresse wird vom Netzwerk vergeben (DHCP/statisch), 32/128 Bit, Schicht 3, netzwerk- und internetweit routbar.

> [!question]- Wie erfährt ein Switch, an welchem Port ein Gerät hängt?
> Der Switch lernt aus den Quell-MAC-Adressen eingehender Frames: Er trägt in seine Forwarding-Tabelle ein: MAC-Adresse X → Port Y. Später leitet er Frames für MAC X nur noch an Port Y weiter.

> [!question]- Wozu dient ARP und wie funktioniert der Ablauf?
> ARP löst eine bekannte IP-Adresse in die zugehörige MAC-Adresse auf. Der Sender schickt einen ARP-Request als Broadcast (Ziel-MAC ff:ff:ff:ff:ff:ff): ‚Wer hat IP 192.168.1.5?‘. Nur der Besitzer dieser IP antwortet per Unicast: ‚IP 192.168.1.5 hat MAC aa:bb:cc:dd:ee:ff‘.

> [!question]- Ein PC will einen Server im Internet erreichen. Nach wessen MAC-Adresse fragt er per ARP?
> Nach der MAC-Adresse des Routers (Default Gateway), weil der Router das Paket aus dem eigenen Netz weiterleitet. Die Ziel-IP im Paket bleibt die des Servers, die Ziel-MAC im Frame wird aber die des Routers sein.

> [!question]- Wie viele MAC-Adressen hat ein Laptop mit LAN-Port und WLAN?
> Zwei – eine für den LAN-Port, eine für das WLAN-Interface. Jedes Netzwerk-Interface braucht seine eigene MAC-Adresse.

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
