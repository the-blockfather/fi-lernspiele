<script type="text/markdown" id="md"># Handout: VLAN-Tag und VLAN-ID


## In einem Satz

Der VLAN-Tag im Ethernet-Frame trägt eine 12 Bit lange VLAN-ID, die 4096 ID-Werte ermöglicht (davon 4094 als VLAN nutzbar).

## Worum geht's

Ein VLAN-Tag wird in den Ethernet-Frame eingefügt, um Datenpaketen eine virtuelle Netzwerkzugehörigkeit zu geben. Das Feld für die VLAN-ID (VID) ist genau 12 Bit groß. Mit 12 Bit lassen sich 2 hoch 12 = 4096 verschiedene Werte darstellen (0 bis 4095). Die Werte 0 und 4095 sind reserviert, daher stehen 4094 IDs für nutzbare VLANs zur Verfügung. Der Tag enthält außerdem ein 3-Bit-Prioritätsfeld (PCP) und ein 1-Bit-Flag (DEI/CFI); der ganze Tag (TPID + TCI) ergibt 4 Byte Overhead.

> [!example] Alltagsvergleich
> Wie ein farbiger Aufkleber auf einem Briefumschlag: Der Aufkleber (Tag) hat ein Feld für die Abteilungsnummer (VLAN-ID). Da das Feld nur 12 Stellen für Ziffern hat (Bits), passen maximal 4096 verschiedene Nummern drauf. Zwei Nummern sind für interne Zwecke gesperrt.

## Kernpunkte

1. Der **VLAN-Tag** (nach Standard 802.1Q) wird zwischen Quell-MAC und EtherType in den Frame geschoben.
2. Er ist **4 Byte** (32 Bit) groß und besteht aus **TPID** (Tag Protocol Identifier, 0x8100), **TCI** (Tag Control Information).
3. Das **TCI** teilt sich auf: **3 Bit PCP** (Priorität), **1 Bit DEI** (Drop Eligible Indicator), **12 Bit VLAN-ID (VID)**.
4. **12 Bit** ergeben **4096** theoretische IDs (0 bis 4095).
5. **ID 0** bedeutet: Prioritätstag ohne VLAN-Zugehörigkeit. **ID 4095 (0xFFF)** ist reserviert.
6. Für echte VLANs nutzbar: **ID 1 bis 4094** (also 4094 VLANs). Buch S. 288/307: „2¹² VLANs unterscheidbar“ (= 4096 Werte); nach Norm sind davon 4094 nutzbar (Errata LF03).
7. **Native VLAN** (oft ID 1) wird untagged über Trunk-Ports geschickt.
8. Der Tag erhöht den Frame-Overhead um 4 Byte. Die MTU (Nutzdaten, Buch S. 307) bleibt 1500 Byte; der maximale Frame wächst von 1518 auf 1522 Byte, Geräte müssen das unterstützen (sonst werden diese „Baby Giants“ verworfen).

## Aufbau des VLAN-Tags (TCI, 16 Bit)

| Feld | Länge | Beschreibung |
|---|---|---|
| PCP (Priority Code Point) | 3 Bit | QoS-Priorität 0–7 |
| DEI (Drop Eligible Indicator) | 1 Bit | Markierung bei Überlast (verwerfbar) |
| VID (VLAN Identifier) | 12 Bit | VLAN-Nummer 0–4095 |

## Beispiel: Rechnung: Anzahl möglicher VLAN-IDs

1. Formel: 2 ^ Anzahl_Bits
2. Einsetzen: 2 ^ 12
3. Rechnen: 2 ^ 10 = 1024; 1024 * 4 = 4096
4. Abzug Reserviert: 4096 - 2 (ID 0 und ID 4095) = 4094 nutzbare IDs

**Ergebnis:** 4096 mögliche IDs, davon 4094 für VLANs nutzbar

## 💡 Merksätze

> 💡 VLAN-ID = 12 Bit = 4096 Werte (0–4095).

> 💡 Null und 4095 sind tabu – 4094 bleiben für dich.

> 💡 Tag = 4 Byte Overhead: TPID (2B) + TCI (2B).

> 💡 TCI = 3 Bit Prio + 1 Bit DEI + 12 Bit VID.

## Prüfungsfallen

- Verwechslung: VLAN-ID-Länge (12 Bit) vs. Tag-Gesamtlänge (32 Bit / 4 Byte). Richtig: VID ist 12 Bit, ganzer Tag 4 Byte.
- Verwechslung: Anzahl IDs (4096) vs. nutzbare VLANs (4094). Richtig: 0 und 4095 reserviert.
- Verwechslung: Native VLAN ist immer VLAN 1. Richtig: Standardmäßig oft 1, aber konfigurierbar.
- Verwechslung: TPID 0x8100 vs. EtherType. Richtig: TPID kennzeichnet Tag; EtherType folgt dahinter.
- Vergessen: Tag erhöht die Frame-Größe (1518 → 1522 Byte); die MTU (Nutzdaten) bleibt 1500 Byte. Geräte, die nur 1518 Byte erlauben, verwerfen getaggte Frames (Baby Giants).

## Im Buch

- VLAN, Trunk, Tag (4 Byte, 12-Bit-ID): S. 288
- VLAN-Tag-Aufbau (TPID 0x8100, Prio, CF/DEI, VLAN-ID): S. 307

## Prüffragen

> [!question]- Wie viele Bit hat das VLAN-ID-Feld im VLAN-Tag und wie viele verschiedene IDs sind damit theoretisch möglich?
> Das VLAN-ID-Feld (VID) ist 12 Bit lang. Damit sind 2^12 = 4096 verschiedene IDs (0 bis 4095) möglich.

> [!question]- Welche VLAN-IDs sind reserviert und dürfen nicht für normale VLANs verwendet werden?
> ID 0 (Prioritätstag ohne VLAN) und ID 4095 (0xFFF, reserviert) sind reserviert. Nutzbare IDs: 1 bis 4094.

> [!question]- Wie groß ist der Overhead, den ein VLAN-Tag dem Ethernet-Frame hinzufügt?
> Der VLAN-Tag fügt 4 Byte (32 Bit) Overhead hinzu: 2 Byte TPID (0x8100) und 2 Byte TCI.

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
