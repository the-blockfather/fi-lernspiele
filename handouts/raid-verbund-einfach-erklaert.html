<script type="text/markdown" id="md"># Handout: RAID-Verbund einfach erklärt


## In einem Satz

RAID schaltet mehrere Festplatten zu einem logischen Laufwerk zusammen, um Geschwindigkeit oder Ausfallsicherheit zu erhöhen.

## Worum geht's

RAID (Redundant Array of Independent Disks) fasst mehrere physische Platten zu einer logischen Platte zusammen. Je nach Level (0, 1, 5, 6, 10) steigt die Lese- und Schreibgeschwindigkeit oder die Sicherheit bei Plattenausfall. RAID 0 verteilt Daten ohne Reserve (Striping), RAID 1 spiegelt alles (Spiegelung), RAID 5/6 nutzen Paritätsinformationen für Wiederherstellung. JBOD hängt Platten nur aneinander, ohne Tempo- oder Sicherheitsgewinn. Wichtig: RAID schützt nur vor Hardware-Defekt, nicht vor Löschfehlern oder Viren – dafür brauchst du Backups.

> [!example] Alltagsvergleich
> Stell dir ein Schreibbüro vor: Bei RAID 0 teilen sich mehrere Schreiber einen Text seitenweise auf (schneller, aber fällt einer aus, fehlen Seiten). Bei RAID 1 schreibt jeder Schreiber den kompletten Text ab (sicher, aber doppelter Aufwand). Bei RAID 5 schreibt jeder einen Teil und zusätzlich eine Prüfsumme, damit man fehlende Seiten rekonstruieren kann. JBOD ist wie lose Blätter in verschiedenen Schubladen – kein System, kein Schutz.

## Kernpunkte

1. **RAID-Level** bestimmen Ziel und Mindestanzahl Platten: RAID 0 (Striping, 2 Platten, 0 Ausfall), RAID 1 (Spiegelung, 2 Platten, 1 Ausfall), RAID 5 (Striping + verteilte Parität, 3 Platten, 1 Ausfall), RAID 6 (doppelte Parität, 4 Platten, 2 Ausfälle), RAID 10 (Spiegel-Stripe, 4 Platten, 1 Ausfall pro Spiegel).
2. **Notation RAID (n,m)**: n = Gesamtplatten, m = darf ausfallen. Leserate = n × Einzelrate, Schreibrate = (n−m) × Einzelrate, **Kapazität = (n−m) × Einzelkapazität**. Die Formeln gelten für die (n,m)-Schreibweise (RAID 0/1/5/6, Buch S. 381) und sind idealisiert: Real schreibt RAID 5 wegen der Paritätsberechnung langsamer. RAID 10 passt nicht in diese Formel: Dort gilt fachlich Kapazität = n/2 × Einzelkapazität (4 Platten = 2 nutzbar).
3. **Hardware-RAID** nutzt eigenen Controller (schnell, kostet Geld). **Software-RAID** rechnet die CPU (billiger, belastet System).
4. **Hot-Spare** ist eine eingebaute Reserveplatte, die der Controller bei Defekt automatisch einbindet und neu befüllt (Rebuild).
5. **JBOD (Just a Bunch of Disks)** hängt Platten nur aneinander (Concatenation). Es gibt **keine** Redundanz und **keinen** Tempovorteil.
6. **RAID ≠ Backup**: RAID fängt Plattenausfall ab. Es schützt **nicht** vor versehentlichem Löschen, Verschlüsselungstrojanern, Brand oder Diebstahl.
7. **RAID 0** hat trotz Namen **keine** Redundanz – eine kaputte Platte = Totalverlust. **RAID 10** (erst spiegeln, dann stripen) ist sicherer als **RAID 01** (zwei RAID-0-Verbunde spiegeln).

## RAID-Level im Überblick

| Level | Prinzip | Min. Platten | Darf ausfallen |
|---|---|---|---|
| RAID 0 | Striping (Verteilen) | 2 | 0 |
| RAID 1 | Spiegelung (Mirroring) | 2 | 1 |
| RAID 5 | Striping + verteilte Parität | 3 | 1 |
| RAID 6 | Striping + doppelte Parität | 4 | 2 |
| RAID 10 | Stripe aus Spiegeln (1+0) | 4 | 1 pro Spiegel |

## Beispiel: Kapazität & Leistung bei RAID 5 (5 Platten à 2 TB)

1. 1. Parameter notieren: n = 5 Platten gesamt, m = 1 Platte darf ausfallen (RAID 5). Einzelkapazität = 2 TB.
2. 2. Formel für nutzbare Kapazität anwenden: Kapazität = (n − m) × Einzelkapazität.
3. 3. Einsetzen: (5 − 1) × 2 TB = 4 × 2 TB.
4. 4. Rechnen: 8 TB nutzbare Kapazität.
5. 5. Leserate: n × Einzelrate = 5-fache Einzelrate.
6. 6. Schreibrate: (n − m) × Einzelrate = 4-fache Einzelrate.

**Ergebnis:** Nutzbare Kapazität 8 TB, Lesen 5× schneller, Schreiben 4× schneller als Einzelplatte (idealisiert nach Buchformel S. 381).

## 💡 Merksätze

> 💡 RAID 0: Schnell, aber kein Netz – eine Platte weg, alles weg.

> 💡 RAID 1: Alles doppelt – eine Platte darf sterben.

> 💡 RAID 5/6: Parität rettet Daten – 1 bzw. 2 Platten Ausfall okay.

> 💡 JBOD = Just a Bunch of Disks – nur aneinandergehängt, kein Schutz, kein Tempo.

> 💡 RAID schützt vor Plattenausfall, Backup vor Datenverlust (Löschen, Verschlüsselung, Brand).

## Prüfungsfallen

- Verwechslung: ‚JBOD ist ein RAID-Level.‘ → Richtig: JBOD ist **kein** RAID, bietet weder Redundanz noch Striping.
- Verwechslung: ‚RAID 0 bietet Redundanz, weil es RAID heißt.‘ → Richtig: RAID 0 hat **keine** Redundanz (Striping only).
- Verwechslung: ‚RAID ersetzt das Backup.‘ → Richtig: RAID schützt nur vor Plattenausfall, nicht vor Datenverlust durch Software/Fehler.
- Verwechslung: ‚Bei RAID (n,m) ist m die Anzahl der Datenplatten.‘ → Richtig: m = Anzahl der Platten, die ohne Datenverlust ausfallen dürfen (Buch S. 381); n − m Platten entsprechen der Nutzkapazität.
- Verwechslung: ‚RAID 10 und RAID 01 sind gleich.‘ → Richtig: RAID 10 = erst spiegeln, dann stripen (sicherer). RAID 01 = zwei RAID-0 spiegeln (Buch S. 380: nur ein RAID 0 darf ausfallen; nach einem Plattenausfall ist der ganze Strang verloren).

## Im Buch

- RAID: S. 379


## Prüffragen

> [!question]- Wofür steht die Abkürzung JBOD und was ist die Eigenschaft?
> Just a Bunch of Disks. Platten werden nur aneinandergehängt (Concatenation), es entsteht weder Redundanz noch Geschwindigkeitsvorteil.

> [!question]- Wie berechnest du die nutzbare Kapazität eines RAID-Verbunds in der Schreibweise RAID (n,m)?
> Formel: (n − m) × Kapazität einer Einzelplatte. n = Gesamtzahl Platten, m = Anzahl der Platten, die ausfallen dürfen.

> [!question]- Warum ist ein RAID 1 kein Ersatz für eine Datensicherung?
> Der Spiegel übernimmt jede Änderung sofort – auch versehentliches Löschen oder Verschlüsselung durch Schadsoftware. Er schützt nur vor dem Ausfall einer physischen Platte.

> [!question]- Ein RAID 5 besteht aus 4 Platten à 1 TB. Wie groß ist die nutzbare Kapazität und wie viele Platten dürfen ausfallen?
> RAID (4,1): Kapazität = (4−1) × 1 TB = 3 TB. Eine Platte darf ausfallen (m=1).

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
