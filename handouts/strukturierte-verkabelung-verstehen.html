<script type="text/markdown" id="md"># Handout: Strukturierte Verkabelung verstehen


## In einem Satz

Die strukturierte Verkabelung ist ein passives, hierarchisches Kabelsystem für alle Dienste, das aktive Technik wie Switches und Router strikt trennt.

## Worum geht's

Eine strukturierte Verkabelung verbindet Gebäude, Etagen und Arbeitsplätze nach einem festen Plan. Sie besteht nur aus Kabeln, Dosen und Patchfeldern – also passiven Teilen. Aktive Geräte wie Switches oder Router gehören nicht dazu, sie werden später in den Schrank gesteckt. Das System ist in drei Ebenen gegliedert: Primär (zwischen Gebäuden), Sekundär (zwischen Etagen) und Tertiär (zur Dose). So kann man jeden Anschluss flexibel nutzen, ohne Wände aufzubrechen.

> [!example] Alltagsvergleich
> Stell dir das wie das Stromnetz im Haus vor: Die festen Kabel in der Wand (Verkabelung) enden einerseits an der Anschlussleiste im Schrank (Patchfeld) und andererseits an den Steckdosen in den Räumen (Dosen). Das Endgerät steckst du an die Dose. Welche Dose mit welchem Switch-Port (aktive Technik im Schrank) verbunden ist, entscheidest du später per kurzem Stecker-Kabel (Patchkabel) am Patchfeld. Ziehst du um, steckst du nur dieses Kabel um – die Kabel in der Wand bleiben.

## Kernpunkte

1. Drei **Ebenen**: **Primärverkabelung** (Standort- zu Gebäudeverteiler, meist **LWL**; auch Flächenverkabelung), **Sekundärverkabelung** (Gebäude- zu Etagenverteiler, LWL/Kupfer; auch Vertikalverkabelung/Steigleitungsbereich), **Tertiärverkabelung** (Etagenverteiler zu **Anschlussdose**, meist Kupfer; auch Horizontalverkabelung). Buch S. 312.
2. Topologie: Ein **erweiterter Stern** über drei Ebenen. Mit **Querverbindungen** (Reserveleitungen zwischen Verteilern) wird daraus eine **unvollständige Masche** für Ausfallsicherheit.
3. **Passiv vs. Aktiv**: Zur Verkabelung gehören nur Kabel, Dosen, Patchfelder. **Switches** und **Router** sind aktive Komponenten, sie sitzen im 19-Zoll-Schrank und werden bei Bedarf getauscht.
4. **Permanent Link** (fest: Patchfeld → Dose) maximal **90 m**. **Channel Link** (gesamt: Switch → Endgerät inkl. Patch- und Anschlusskabel) maximal **100 m**.
5. **Patchfeld** (Patchpanel) ist die passive Anschlussleiste im Schrank. Hinten endet je Buchse eine feste Leitung. Vorne steckst du **Patchkabel** zum **Rangieren** (Verbinden von Switch-Port und Dose).
6. **19-Zoll-Schrank** (Rack) ist das Standardgehäuse (48,3 cm Breite). Darin sitzen Patchfelder, Switches, Router, Telefonanlage.
7. **Dokumentation** ist Pflicht: Gebäude (Buchstaben), Stockwerke (ab 0), Verteiler (Nummern), Dosen (beschriftet). Am Verteiler liegt eine **Portliste** (Leitungstyp, Zielraum).
8. **Sammelpunkt** (Consolidation Point): Unterverteiler sind nach Norm nicht vorgesehen. Ausnahme: Auf der Tertiärebene darf ein TA als Sammelpunkt dienen, an dem weitere TAs im Raum angeschlossen werden (z. B. Schulungsraum mit vielen Rechnern, Buch S. 313).

## Vergleich Permanent Link vs. Channel Link

| Merkmal | Permanent Link | Channel Link |
|---|---|---|
| Strecke | Patchfeld → Anschlussdose (fest) | Switch → Endgerät (gesamt) |
| Max. Länge | 90 m | 100 m |
| Bestandteile | Verlegekabel, Dose, Patchfeld-Buchse | Permanent Link + Patchkabel (Schrank) + Anschlusskabel (Gerät) |
| Prüfung | Bei Abnahme der Verkabelung | Bei Inbetriebnahme / Fehlersuche |

## Beispiel: Längen-Check einer Strecke

1. Gegeben: Verlegekabel Patchfeld → Dose = 85 m (Permanent Link).
2. Patchkabel im Schrank (Switch → Patchfeld) = 3 m.
3. Anschlusskabel an der Dose (Dose → PC) = 5 m.
4. Rechnung Channel Link: 85 m + 3 m + 5 m = 93 m.
5. Prüfung: 93 m ≤ 100 m → Channel Link ist zulässig.
6. Prüfung Permanent Link: 85 m ≤ 90 m → Permanent Link ist zulässig.

**Ergebnis:** Beide Links sind innerhalb der Norm. Wäre das Verlegekabel 92 m lang, wäre der Permanent Link ungültig (> 90 m), auch wenn der Channel Link mit 92 m + 3 m + 5 m = 100 m (≤ 100 m) noch zulässig wäre.

## 💡 Merksätze

> 💡 Verkabelung ist passiv – Switch und Router sind aktiv.

> 💡 Permanent 90 Meter, Channel 100 Meter – die 10 Meter Differenz sind die Patchkabel.

> 💡 Drei Ebenen: Primär (meist LWL), Sekundär (LWL/Kupfer), Tertiär (meist Kupfer).

> 💡 Rangieren heißt: Patchkabel umstecken, Festverkabelung bleibt.

> 💡 Beschriftung: Gebäude – Stock – Verteiler – Patchfeld – Port.

## Prüfungsfallen

- Verwechslung: Switch/Router gehören zur Verkabelung. Richtig: Nur passive Teile (Kabel, Dosen, Patchfelder) gehören dazu. Aktive Geräte sind austauschbar.
- Verwechslung: Permanent Link und Channel Link sind gleich lang. Richtig: Permanent Link max. 90 m (fest), Channel Link max. 100 m (inkl. Patchkabel).
- Verwechslung: Primär/Sekundär/Tertiär sind OSI-Schichten. Richtig: Das sind räumliche Hierarchie-Ebenen der Verkabelung, keine Protokollschichten.
- Verwechslung: Patchkabel-Kategorie ist egal. Richtig: Das schwächste Bauteil (niedrigste Kategorie) bestimmt die Klasse der ganzen Strecke.
- Verwechslung: Unterverteiler sind Standard. Richtig: Nicht vorgesehen, Ausnahme ist nur ein Sammelpunkt (Consolidation Point) auf Tertiärebene.

## Prüffragen

> [!question]- Was ist der Unterschied zwischen Permanent Link und Channel Link bei der maximalen Länge und dem Umfang?
> Der Permanent Link ist die fest verlegte Strecke vom Patchfeld zur Dose (max. 90 m). Der Channel Link ist der komplette Kanal vom Switch zum Endgerät inklusive aller Patch- und Anschlusskabel (max. 100 m).

> [!question]- Warum gehören Switches und Router nicht zur strukturierten Verkabelung?
> Weil die strukturierte Verkabelung per Definition nur die passive Infrastruktur (Kabel, Dosen, Patchfelder) umfasst. Switches und Router sind aktive Netzwerkkomponenten, die in den Verteilerschrank eingebaut und bei Bedarf getauscht werden.

> [!question]- Welche drei hierarchischen Ebenen kennt die strukturierte Verkabelung und welches Medium wird in der Primärverkabelung bevorzugt?
> Primärverkabelung (Standort- zu Gebäudeverteiler, bevorzugt Lichtwellenleiter), Sekundärverkabelung (Gebäude- zu Etagenverteiler, LWL oder Kupfer), Tertiärverkabelung (Etagenverteiler zu Anschlussdose, meist Kupfer).

> [!question]- Was versteht man unter 'rangieren' im Verteilerschrank?
> Rangieren (Patchen) ist das Verbinden eines Switch-Ports mit einer Buchse des Patchfelds über ein Patchkabel. Damit wird ein aktiver Port mit einer bestimmten Netzwerkdose verbunden.

> [!question]- Ein Verlegekabel ist 92 m lang. Ist der Permanent Link zulässig? Begründe.
> Nein. Der Permanent Link darf maximal 90 m lang sein. 92 m überschreiten das Limit, auch wenn der Channel Link durch kurze Patchkabel noch innerhalb von 100 m bliebe.

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
