<script type="text/markdown" id="md"># Handout: Patchfeld & Rangieren verstehen


## In einem Satz

Das Patchfeld ist die passive Anschlussleiste für die fest verlegte Verkabelung, und über Patchkabel werden Switch-Ports flexibel mit den Netzwerkdosen verbunden.

## Worum geht's

Im Verteilerschrank (19-Zoll-Rack) sitzt das Patchfeld. Hinten enden die fest in der Wand verlegten Kabel – an jeder Buchse genau eines. Vorne steckst du kurze, flexible Patchkabel ein. Damit verbindest du einen Port des Switchs (aktive Technik) mit einer bestimmten Dose im Büro. Dieses Umstecken nennt man rangieren oder patchen. So bleibt die teure Festverkabelung unberührt, wenn jemand umzieht oder ein Gerät getauscht wird.

> [!example] Alltagsvergleich
> Stell dir das Patchfeld wie einen Hauptverteiler im Keller vor: Alle Stromkabel der Räume enden dort fest an Klemmen. Willst du in einem Raum Strom haben, steckst du vorne nur ein kurzes Verlängerungskabel (Patchkabel) von der Hauptsicherung (Switch) auf die Klemme des Raums. Zieht der Mieter aus, ziehst du das kurze Kabel ab – die Wandleitung bleibt.

## Kernpunkte

1. Ein **Patchfeld (Patchpanel)** ist eine passive Buchsenleiste im 19-Zoll-Schrank (48,3 cm Breite). Hinten werden die festen Verlegekabel aufgelegt (eine Leitung pro Buchse), vorne stecken die Patchkabel.
2. Ein **Patchkabel** ist ein kurzes, flexibles Kabel mit Steckern (meist RJ45). Es verbindet einen **Switch-Port** (aktiv, braucht Strom) mit einer **Patchfeld-Buchse**. Das Verbinden heißt **rangieren** oder **patchen**.
3. Der **Permanent Link** ist die feste Strecke **Patchfeld → Netzwerkdose** (max. 90 m). Der **Channel Link** ist die komplette Strecke **Switch → Endgerät** inklusive Patchkabel im Schrank und Anschlusskabel am Platz (max. 100 m).
4. **Patchfeld ≠ Switch**: Das Patchfeld ist passiv (nur Metallkontakte), der Switch ist aktiv (Elektronik, Prozessor, Strom). Verwechsle sie nicht in Prüfungsfragen.
5. Am Verteiler gibt es meist keine Kennzeichnung, wohin ein Kabel führt (Buch S. 314). Deshalb muss eine **Portliste** am Schrank hängen: Patchfeld-Nummer, Port-Nummer, Leitungstyp (z. B. Cat 6A), Raum/Zimmer.
6. Die **Kategorie** (z. B. Cat 6A) gilt für das einzelne Bauteil (Kabel, Dose, Patchkabel). Die **Klasse** (z. B. Klasse EA) gilt für die *ganze* montierte Strecke. Das schwächste Bauteil bestimmt die erreichbare Klasse.

## Überblick

| Merkmal | Permanent Link | Channel Link |
|---|---|---|
| Strecke | Patchfeld → Dose (fest) | Switch → Endgerät (gesamt) |
| Max. Länge | 90 m | 100 m |
| Bestandteile | Verlegekabel, Auflegedosen, Patchfeld-Buchsen | Permanent Link + Patchkabel (Schrank) + Anschlusskabel (Platz) |
| Prüfung | meist nach Installation (Abnahme) | bei Bedarf, z. B. Inbetriebnahme / Fehlersuche |

## Beispiel: Patchfeld & Rangieren

1. Gegeben: Festverkabelung (Patchfeld → Dose) = 85 m, Patchkabel im Verteiler = 5 m, Anschlusskabel am Arbeitsplatz = 12 m.
2. 1. Permanent Link prüfen: 85 m ≤ 90 m → **OK**.
3. 2. Channel Link berechnen: 85 m + 5 m + 12 m = 102 m.
4. 3. Channel Link prüfen: 102 m > 100 m → **NICHT OK**.
5. Lösung: Anschlusskabel kürzen (z. B. auf 10 m), dann Channel = 100 m → OK.

**Ergebnis:** Permanent Link OK, Channel Link zu lang (102 m > 100 m). Anschlusskabel muss max. 10 m lang sein (100 m - 85 m - 5 m = 10 m). Das ist die vereinfachte Prüfungsrechnung; in der Praxis werden flexible Patchkabel mit einem Dämpfungsfaktor bewertet.

## 💡 Merksätze

> 💡 Patchfeld: Hinten fest verlegt, vorn flexibel patchen.

> 💡 Rangieren = Patchkabel umstecken, nicht Kabel neu verlegen.

> 💡 Permanent Link 90 m, Channel Link 100 m – die 10 m Differenz sind Puffer für Patch- und Anschlusskabel.

> 💡 Schwächstes Glied bremst die Strecke: Patchkabel-Kategorie muss zur Strecke passen.

> 💡 Keine Portliste = Blindflug: Am Patchfeld siehst du meist nicht, wohin das Kabel geht.

## Prüfungsfallen

- Verwechslung: Patchfeld ist aktiv wie ein Switch. / Richtig: Patchfeld ist **passiv**, Switch ist **aktiv**.
- Verwechslung: Permanent Link und Channel Link sind beide 100 m. / Richtig: Permanent Link **90 m** (fest), Channel Link **100 m** (gesamt).
- Verwechslung: Patchkabel-Kategorie ist egal, Hauptsache Stecker passt. / Richtig: Patchkabel **muss gleiche oder höhere Kategorie** haben wie die Festverkabelung, sonst sinkt die Klassen-Leistung.
- Verwechslung: Am Patchfeld steht drauf, welches Zimmer dranhängt. / Richtig: Am Verteiler gibt es meist keine Kennzeichnung; man braucht eine **Portliste** (Dokumentation).
- Verwechslung: Rangieren bedeutet, Kabel in der Wand umzulegen. / Richtig: Rangieren ist **nur Umstecken der Patchkabel** vorne am Patchfeld.

## Im Buch

- Permanent Link: S. 313
- Channel Link: S. 313


## Prüffragen

> [!question]- Was endet an jeder Buchse eines Patchfelds?
> An jeder Buchse endet genau eine fest verlegte Leitung (Verlegekabel) der strukturierten Verkabelung.

> [!question]- Erkläre den Unterschied zwischen Permanent Link und Channel Link.
> Permanent Link ist die feste Strecke Patchfeld → Dose (max. 90 m). Channel Link ist die Gesamtstrecke Switch → Endgerät inkl. Patchkabel im Schrank und Anschlusskabel am Platz (max. 100 m).

> [!question]- Warum sollte ein Patchkabel der Kategorie 5e nicht an einer Cat-6A-Strecke verwendet werden?
> Das schwächste Bauteil bestimmt die Klasse der ganzen Strecke. Ein Cat-5e-Patchkabel begrenzt die Leistung auf Klasse D (100 MHz), obwohl die Festverkabelung Cat 6A (500 MHz) kann.

> [!question]- Welche Infos müssen auf der Portliste am Verteiler stehen?
> Patchfeld-Nummer, Port-Nummer, Leitungstyp (Kategorie) und Raum-/Zimmernummer.

<script>// lernspiel/fi-quiz/src/md.js - kleiner Markdown-Renderer (ohne Bibliothek) für Handout-Seiten und die Handout-Werkstatt.
// Kann: Überschriften, Absätze, Listen (auch nummeriert), Tabellen, Zitate/Obsidian-Callouts (> [!typ]- Titel),
// **fett**, *kursiv*, `Code`, [Text](https://…), Trennlinie. Alles wird zuerst escaped - Links nur http(s).
"use strict";
function mdZuHtml(md) {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1<\/code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1<\/b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2<\/i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
  const zeilen = String(md || "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const zelle = (z) => z.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (!z.trim()) { i++; continue; }
    let m;
    if ((m = z.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 6); out.push(`<h${n}>${inline(m[2])}<\/h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(z)) { out.push("<hr>"); i++; continue; }
    if (z.startsWith(">")) {                                   // Zitat bzw. Callout
      const block = []; while (i < zeilen.length && zeilen[i].startsWith(">")) block.push(zeilen[i++].replace(/^>\s?/, ""));
      const c = block[0].match(/^\[!(\w+)\]([+-]?)\s*(.*)$/);
      if (c) {
        const innen = mdZuHtml(block.slice(1).join("\n")), titel = inline(c[3] || c[1]);
        out.push(c[2] ? `<details class="callout ${esc(c[1].toLowerCase())}"${c[2] === "+" ? " open" : ""}><summary>${titel}<\/summary>${innen}<\/details>`
          : `<div class="callout ${esc(c[1].toLowerCase())}"><div class="ct">${titel}<\/div>${innen}<\/div>`);
      } else out.push(`<blockquote>${mdZuHtml(block.join("\n"))}<\/blockquote>`);
      continue;
    }
    if (z.trim().startsWith("|") && i + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[i + 1])) {   // Tabelle
      const kopf = zelle(z); i += 2; const rows = [];
      while (i < zeilen.length && zeilen[i].trim().startsWith("|")) rows.push(zelle(zeilen[i++]));
      out.push(`<div class="tab"><table><thead><tr>${kopf.map((c) => `<th>${inline(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}<\/td>`).join("")}<\/tr>`).join("") + "<\/tbody><\/table><\/div>");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(z)) {                    // Liste (eine Ebene, Einrückung wird angehängt)
      const nummer = /^\s*\d+[.)]/.test(z), items = [];
      while (i < zeilen.length && (/^\s*([-*+]|\d+[.)])\s+/.test(zeilen[i]) || (/^\s{2,}\S/.test(zeilen[i]) && items.length))) {
        const t = zeilen[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(t) && !/^\s{2,}/.test(t)) items.push(t.replace(/^\s*([-*+]|\d+[.)])\s+/, "").replace(/^\[[ x]\]\s*/, ""));
        else items[items.length - 1] += "<br>" + t.trim().replace(/^([-*+]|\d+[.)])\s+/, "• ");
      }
      const tag = nummer ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${t.split("<br>").map(inline).join("<br>")}<\/li>`).join("")}<\/${tag}>`);
      continue;
    }
    const abs = []; while (i < zeilen.length && zeilen[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(zeilen[i])) abs.push(zeilen[i++]);
    if (!abs.length) abs.push(zeilen[i++]);
    out.push(`<p>${abs.map(inline).join("<br>")}<\/p>`);
  }
  return out.join("\n");
}
if (typeof module !== "undefined") module.exports = { mdZuHtml };
</script>
